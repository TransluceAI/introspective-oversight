[project]
name = "introspect"
version = "0.1.0"
description = "Training Models for Introspective Oversight"
requires-python = ">=3.12"
dependencies = [
    "chz",
    "datasets>=5.1.0",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
    "msgspec",
    "numpy",
    "tinker",
    "tinker-cookbook",
    "torch",
    "wandb",
]

[project.optional-dependencies]
dev = ["pyright", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["introspect"]
